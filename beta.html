<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OchtendFlow Beta</title>
<style>body{font:17px system-ui;background:#f8f4ec;color:#263b31;margin:0}main{max-width:900px;margin:auto;padding:24px}header,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}section,article,form{background:white;border:1px solid #ddd9cf;border-radius:16px;padding:20px;margin:18px 0}label{display:block;margin:14px 0}input,select,button,a.action{font:inherit;padding:10px;border:1px solid #9ca99e;border-radius:8px;max-width:100%;box-sizing:border-box}button,a.action{cursor:pointer;background:#eaf0e8;color:#163a28}a.action{display:inline-block;margin:8px 8px 0 0;text-decoration:none}fieldset{border:1px solid #ddd}fieldset label{display:inline-flex;gap:6px;margin:8px}small,.muted{color:#526358}#status{min-height:1.5em}h2{font-size:1.3em}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a55013;outline-offset:3px}</style>
<main><header><h1>OchtendFlow <small>Beta</small></h1><label><span data-t="language"></span> <select id="language"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option></select></label></header><p data-t="intro"></p><p data-t="limits" class="muted"></p><p id="status" role="status"></p><section><h2 data-t="week"></h2><div id="week"></div></section><section><div class="row"><h2 data-t="schedules"></h2><button id="add" data-t="add"></button></div><div id="schedules"></div></section><form id="editor" hidden><h2 data-t="edit"></h2><label><span data-t="name"></span><input id="name" required maxlength="80"></label><fieldset id="days"><legend data-t="days"></legend></fieldset><label><span data-t="type"></span><select id="type"></select></label><label><span data-t="time"></span><input id="time" type="time" required></label><label><span data-t="minutes"></span><input id="minutes" type="number" min="5" max="120" step="1" required></label><label><span data-t="videoLanguage"></span><select id="videoLanguage"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option></select></label><label><input id="enabled" type="checkbox"> <span data-t="enabled"></span></label><button type="submit" data-t="save"></button> <button id="cancel" type="button" data-t="cancel"></button><p data-t="searchNote" class="muted"></p></form><footer><p data-t="storage"></p><p data-t="safety"></p></footer></main>
<script type="module">
import {videoFor,defaults} from './planner.mjs';
const $=id=>document.getElementById(id);
const texts={
nl:{language:'Taal',intro:'Plan je mobiliteit, krachttraining en HIIT op jouw momenten.',limits:'Testversie: geen eigen meldingen, automatische tv-bediening, beoordelingen of twee persoonlijke voorstellen. Video’s worden niet offline opgeslagen.',week:'Deze week',schedules:'Mijn schema’s',add:'Schema toevoegen',edit:'Trainingsmoment',name:'Naam',days:'Dagen',type:'Training',time:'Starttijd',minutes:'Gewenste duur in minuten',videoLanguage:'Taal voor zoeken naar video’s',enabled:'Actief',save:'Opslaan',cancel:'Annuleren',remove:'Verwijderen',change:'Aanpassen',empty:'Geen trainingen gepland.',search:'Zoek op YouTube',watch:'Bekijk mobiliteitsselectie',searchNote:'Zoeken opent YouTube. Zoekresultaten zijn niet gecontroleerd; taal en duur zijn geen garantie. De vaste mobiliteitsselectie is niet op videotaal gefilterd.',storage:'Schema’s worden alleen in deze browser opgeslagen. Geen account, synchronisatie of back-up. Wissen van browsergegevens kan de schema’s verwijderen.',safety:'Kies een passend niveau en stop bij pijn. Deze planner geeft geen medisch advies.',saved:'Opgeslagen.',failed:'Opslaan is mislukt. De wijziging is niet bewaard.',invalid:'Kies minstens één dag.',confirm:'Dit schema verwijderen?',off:'Uitgeschakeld',migration:'Je bestaande tijd en duur zijn overgenomen.',types:['Mobiliteit','Stretching','Kracht / fitness','HIIT','Cardio']},
en:{language:'Language',intro:'Schedule mobility, strength and HIIT at times that suit you.',limits:'Beta: no native reminders, direct TV control, ratings or two personalised suggestions. Videos are not stored offline.',week:'This week',schedules:'My schedules',add:'Add schedule',edit:'Workout session',name:'Name',days:'Days',type:'Workout',time:'Start time',minutes:'Target duration in minutes',videoLanguage:'Video search language',enabled:'Enabled',save:'Save',cancel:'Cancel',remove:'Delete',change:'Edit',empty:'No workouts scheduled.',search:'Search YouTube',watch:'Watch mobility selection',searchNote:'Search opens YouTube. Results are not checked; language and duration are not guaranteed. The curated mobility selection is not filtered by video language.',storage:'Schedules are stored only in this browser. No account, sync or backup. Clearing browser data may delete your schedules.',safety:'Choose an appropriate level and stop if you feel pain. This planner does not provide medical advice.',saved:'Saved.',failed:'Saving failed. Your change was not saved.',invalid:'Select at least one day.',confirm:'Delete this schedule?',off:'Disabled',migration:'Your existing time and duration were imported.',types:['Mobility','Stretching','Strength / fitness','HIIT','Cardio']},
de:{language:'Sprache',intro:'Plane Mobilität, Krafttraining und HIIT zu deinen Zeiten.',limits:'Testversion: keine eigenen Erinnerungen, direkte TV-Steuerung, Bewertungen oder zwei persönlichen Vorschläge. Videos werden nicht offline gespeichert.',week:'Diese Woche',schedules:'Meine Trainingspläne',add:'Trainingsplan hinzufügen',edit:'Trainingseinheit',name:'Name',days:'Tage',type:'Training',time:'Startzeit',minutes:'Gewünschte Dauer in Minuten',videoLanguage:'Sprache für die Videosuche',enabled:'Aktiv',save:'Speichern',cancel:'Abbrechen',remove:'Löschen',change:'Bearbeiten',empty:'Keine Einheiten geplant.',search:'Auf YouTube suchen',watch:'Mobilitätsauswahl ansehen',searchNote:'Die Suche öffnet YouTube. Ergebnisse sind nicht geprüft; Sprache und Dauer sind nicht garantiert. Die feste Mobilitätsauswahl wird nicht nach Videosprache gefiltert.',storage:'Trainingspläne werden nur in diesem Browser gespeichert. Kein Konto, keine Synchronisierung und kein Backup. Das Löschen von Browserdaten kann die Pläne entfernen.',safety:'Wähle ein passendes Niveau und höre bei Schmerzen auf. Dieser Planer bietet keine medizinische Beratung.',saved:'Gespeichert.',failed:'Speichern fehlgeschlagen. Die Änderung wurde nicht gespeichert.',invalid:'Wähle mindestens einen Tag.',confirm:'Diesen Trainingsplan löschen?',off:'Deaktiviert',migration:'Deine bisherige Zeit und Dauer wurden übernommen.',types:['Mobilität','Stretching','Kraft / Fitness','HIIT','Cardio']}
};
const types=['mobility','stretch','strength','hiit','cardio'];
const key='ochtendflow/planner-v2';
let model={version:2,language:'nl',schedules:[]},editing=null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const valid=s=>s&&typeof s.id==='string'&&typeof s.name==='string'&&s.name.length<=80&&Array.isArray(s.days)&&s.days.length>0&&s.days.every(d=>Number.isInteger(d)&&d>=0&&d<7)&&types.includes(s.type)&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s.time)&&Number.isInteger(s.minutes)&&s.minutes>=5&&s.minutes<=120&&['nl','en','de'].includes(s.videoLanguage)&&typeof s.enabled==='boolean';
let storageError=false;
try{const raw=localStorage.getItem(key);if(raw){const v=JSON.parse(raw);if(v.version!==2||!texts[v.language]||!Array.isArray(v.schedules)||!v.schedules.every(valid))throw Error();model=v;}else{let prefs=defaults;try{const c=await caches.open('ochtendflow/preferences');const r=await c.match(new URL('./.preferences',document.baseURI));if(r){const p=await r.json();if(/^([01]\d|2[0-3]):[0-5]\d$/.test(p.time)&&[5,10,15,20].includes(p.duration))prefs=p;}}catch{}model.schedules=[{id:uid(),name:'OchtendFlow',days:[1,2,3,4,5],type:'mobility',time:prefs.time,minutes:prefs.duration,videoLanguage:'en',enabled:true}];localStorage.setItem(key,JSON.stringify(model));}}catch{storageError=true;}
const t=k=>texts[model.language][k];
function persist(next){try{localStorage.setItem(key,JSON.stringify(next));model=next;$('status').textContent=t('saved');return true;}catch{$('status').textContent=t('failed');return false;}}
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function button(text,fn){const b=el('button',text);b.type='button';b.onclick=fn;return b;}
function link(text,href){const a=el('a',text);a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.className='action';return a;}
function dayLabel(day){const d=new Date(2026,10,22+day,12);return new Intl.DateTimeFormat(model.language,{weekday:'short'}).format(d);}
function typeLabel(type){return t('types')[types.indexOf(type)];}
function searchURL(s){const words={nl:['mobiliteit','stretching','krachttraining fitness','HIIT training','cardio training'],en:['mobility routine','stretching routine','strength workout','HIIT workout','cardio workout'],de:['Mobilität Übungen','Dehnen Routine','Krafttraining Fitness','HIIT Training','Cardio Training']};const query=words[s.videoLanguage][types.indexOf(s.type)]+' '+s.minutes+' min '+({nl:'Nederlands',en:'English',de:'Deutsch'}[s.videoLanguage]);return 'https://www.youtube.com/results?search_query='+encodeURIComponent(query);}
function render(){document.documentElement.lang=model.language;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').value=model.language;$('type').replaceChildren(...types.map((v,i)=>{const o=el('option',t('types')[i]);o.value=v;return o;}));$('days').querySelectorAll('label').forEach(e=>e.remove());for(const day of [1,2,3,4,5,6,0]){const l=el('label');const c=el('input');c.type='checkbox';c.value=day;c.name='day';l.append(c,document.createTextNode(dayLabel(day)));$('days').append(l);}const list=$('schedules');list.replaceChildren();for(const s of model.schedules){const a=el('article');a.append(el('h3',s.name),el('p',s.days.map(dayLabel).join(', ')+' · '+s.time+' · '+s.minutes+' min · '+typeLabel(s.type)+(s.enabled?'':' · '+t('off'))));a.append(button(t('change'),()=>edit(s)),button(t('remove'),()=>{if(confirm(t('confirm'))&&persist({...model,schedules:model.schedules.filter(x=>x.id!==s.id)})){close();render();}}));list.append(a);}if(!model.schedules.length)list.append(el('p',t('empty')));renderWeek();}
function renderWeek(){const root=$('week');root.replaceChildren();const now=new Date();const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7),12);let count=0;for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);const slots=model.schedules.filter(s=>s.enabled&&s.days.includes(d.getDay())).sort((a,b)=>a.time.localeCompare(b.time));for(const s of slots){count++;const a=el('article');a.append(el('h3',new Intl.DateTimeFormat(model.language,{weekday:'long',day:'numeric',month:'short'}).format(d)+' · '+s.time),el('p',s.name+' · '+typeLabel(s.type)+' · '+s.minutes+' min'));a.append(link(t('search'),searchURL(s)));if(s.type==='mobility'&&[5,10,15,20].includes(s.minutes)&&d.getDay()>0&&d.getDay()<6){const v=videoFor(d,s.minutes);a.append(link(t('watch')+' ('+v.length+')',v.url));}root.append(a);}}if(!count)root.append(el('p',t('empty')));}
function edit(s){editing=s?.id??null;$('editor').hidden=false;$('name').value=s?.name??'';$('time').value=s?.time??'16:30';$('minutes').value=s?.minutes??20;$('type').value=s?.type??'strength';$('videoLanguage').value=s?.videoLanguage??model.language;$('enabled').checked=s?.enabled??true;document.querySelectorAll('[name=day]').forEach(c=>c.checked=(s?.days??[1,3,5]).includes(Number(c.value)));$('editor').scrollIntoView({block:'start'});$('name').focus();}
function close(){editing=null;$('editor').hidden=true;}
$('add').onclick=()=>edit(null);$('cancel').onclick=close;
$('language').onchange=()=>{if(persist({...model,language:$('language').value})){close();render();}else $('language').value=model.language;};
$('editor').onsubmit=e=>{e.preventDefault();const s={id:editing??uid(),name:$('name').value.trim(),days:[...document.querySelectorAll('[name=day]:checked')].map(c=>Number(c.value)),type:$('type').value,time:$('time').value,minutes:Number($('minutes').value),videoLanguage:$('videoLanguage').value,enabled:$('enabled').checked};if(!s.days.length){$('status').textContent=t('invalid');return;}if(!s.name||!valid(s))return;const schedules=editing?model.schedules.map(x=>x.id===editing?s:x):[...model.schedules,s];if(persist({...model,schedules})){close();render();}};
render();if(storageError)$('status').textContent=t('failed');
</script></html>
